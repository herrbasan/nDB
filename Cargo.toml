[package]
name = "ndb"
version = "2.0.0"
edition = "2021"
authors = ["ndb Contributors"]
description = "Human-readable document database for the AI age"
license = "MIT OR Apache-2.0"
repository = "https://github.com/herrbasan/nDB"
keywords = ["document", "database", "json", "embedded"]
categories = ["database", "data-structures"]
rust-version = "1.75"
# Bench files are split in two kinds: one Criterion harness, and standalone
# probes that are examples. Auto-discovery would claim every file under
# `benches/` as a bench, putting the probes in two targets at once.
autobenches = false

[features]
# Compiles the fault-injecting `io::FaultIo` into the library so integration
# tests (and the Phase 17 crash matrix) can drive the durable write path at
# every step. Never enabled for a release build.
fault-io = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
fastrand = "2.0"
thiserror = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.9"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
debug = true

[[bench]]
name = "bench_insert"
path = "benches/bench_insert.rs"
harness = false

[[example]]
name = "doc_perf"
path = "benches/doc_perf.rs"

[[example]]
name = "phase3_corpus_bench"
path = "benches/phase3_corpus_bench.rs"

[[example]]
name = "corpus_baseline"
path = "benches/corpus_baseline.rs"
